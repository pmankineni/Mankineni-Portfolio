<title>Pavan Mankineni Portfolio</title>
<style>
/* ============================================================
   THE BREVET BOOK - Pavan Mankineni
   A randonneur roadbook. Eighteen years read as one long ride:
   the road runs down the middle and winds left and right to
   visit each control, and every stop sits on the side the road
   just leaned towards.

   Deliberately single-theme. The brief asked for creamy paper
   and blue ink, so every colour is painted explicitly and the
   page keeps its own light world rather than inverting into
   something that is not a notebook.
   ============================================================ */

@font-face{
  font-family:'Inter';src:url({{FONT_INTER}}) format('woff2');
  font-weight:400 800;font-style:normal;font-display:block;
}
@font-face{
  font-family:'Caveat';src:url({{FONT_CAVEAT}}) format('woff2');
  font-weight:400 700;font-style:normal;font-display:block;
}

:root{
  --paper:#faf6ec;
  --paper-slip:#fffdf6;
  --paper-aged:#f2ead8;
  --grid:rgba(22,32,58,.055);
  --grid-major:rgba(22,32,58,.085);
  --margin-rule:#c4614a;
  --ink:#16203a;
  --ink-body:#3a4356;
  --pencil:#5e5849;
  --pencil-light:#7a6f53;
  --blue:#2c5bd6;
  --blue-deep:#1c40a8;
  --line:rgba(22,32,58,.12);

  --slip-shadow:0 1px 0 rgba(22,32,58,.06), 0 10px 22px -14px rgba(22,32,58,.42);

  --sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --hand:'Caveat','Segoe Script',cursive;

  --road:280px;        /* the centre lane the road winds inside */
  --half:540px;        /* max width of one stop */
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{color-scheme:light}
body{
  font-family:var(--sans);
  font-size:18px;
  line-height:1.5;
  color:var(--ink-body);
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(to right,var(--grid-major) 0 1px,transparent 1px 120px),
    repeating-linear-gradient(to bottom,var(--grid-major) 0 1px,transparent 1px 120px);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- cover ---------- */
.cover{
  position:relative;background:var(--paper-aged);
  border-bottom:1px solid var(--line);
  padding:clamp(30px,5vh,52px) clamp(22px,3vw,44px) clamp(28px,4.5vh,46px);
  overflow:hidden;
}
.cover-inner{width:100%;position:relative;z-index:2}
.cover-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  gap:clamp(18px,2.5vw,40px);align-items:center;text-align:left;width:100%}
.portrait{width:128px;height:128px;border-radius:50%;object-fit:cover;
  border:3px solid var(--paper-slip);box-shadow:var(--slip-shadow)}
.firm{flex:none;display:grid;place-items:center;min-width:132px;padding:14px 18px;
  background:var(--paper-slip);border:1px solid var(--line);box-shadow:var(--slip-shadow);
  transform:rotate(1.2deg)}
/* the logo file carries its own alpha, so it sits straight on the paper -
   no card, no border, no tilt */
.firm.has-logo{background:transparent;border:0;box-shadow:none;padding:0;transform:none}
.firm img{display:block;width:auto;height:auto;max-width:186px;max-height:74px;object-fit:contain}
.firm-t{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.15;text-align:center}
.firm-s{font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil-light);margin-top:4px;text-align:center}

/* ---------- the tiles: what the ride adds up to ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.3vw,18px);
  margin-top:clamp(24px,3.6vh,40px)}
.tile{background:var(--paper-slip);border:1px solid var(--line);border-radius:20px;
  padding:20px 14px 17px;text-align:center;box-shadow:var(--slip-shadow)}
.tile b{display:block;font-size:clamp(1.5rem,2.7vw,2.15rem);font-weight:800;
  letter-spacing:-.03em;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pencil-light);margin-top:9px;line-height:1.35}
.cover h1{
  font-size:clamp(2.1rem,4.2vw,3.3rem);font-weight:800;letter-spacing:-.03em;
  line-height:1.02;color:var(--ink);text-wrap:balance;
}
.cover-role{
  margin-bottom:8px;font-size:12px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--blue);
}


/* The cover's claim. Everything above it is who and how much; this is the
   line that says what it all amounts to. */
.cover-thesis{
  margin-top:clamp(18px,2.4vh,26px);max-width:34ch;
  font-family:var(--hand);font-weight:700;color:var(--blue);
  font-size:clamp(1.5rem,2.6vw,2.2rem);line-height:1.15;
  transform:rotate(-1deg);transform-origin:left center;
}

/* ---------- the page ---------- */
.page{position:relative;padding-bottom:40px}
svg.flights{position:absolute;top:0;left:0;z-index:1;pointer-events:none}
svg.route{position:absolute;top:0;left:0;z-index:2;pointer-events:none}

.route .kerb{fill:none;stroke:var(--blue);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.route .kerb-2{stroke-width:1.4;opacity:.45}
.route .centre{fill:none;stroke:var(--blue);stroke-width:1.7;stroke-linecap:round;opacity:.6}
.route .ctl-ring{fill:var(--paper);stroke:var(--blue);stroke-width:2.4}
.route .ctl-dot{fill:var(--blue)}
.route .leader{fill:none;stroke:var(--blue);stroke-width:1.3;opacity:.38;stroke-dasharray:3 4}
.route .brace{fill:none;stroke:var(--blue);stroke-width:1.5;opacity:.45}
.route .brace-t{font-family:var(--hand);font-size:23px;font-weight:600;fill:var(--blue);
  opacity:.95;text-anchor:middle}

.flights .fl-trail{fill:none;stroke:var(--blue);stroke-width:2;opacity:.72;
  stroke-dasharray:7 8;stroke-linecap:round}
.flights .plane{fill:var(--blue);opacity:.95}

/* ---------- stops, alternating around the road ---------- */
.strip{position:relative;z-index:3;padding:0 clamp(16px,3vw,48px)}
.control{
  position:relative;padding:26px 0;
  display:grid;grid-template-columns:minmax(0,1fr) var(--road) minmax(0,1fr);
}
.anchor{position:absolute;left:50%;top:64px;width:0;height:0}
.half{max-width:var(--half);width:100%;grid-row:1}
.side-l .half{grid-column:1;justify-self:end}
.side-r .half{grid-column:3;justify-self:start}

.slip{
  position:relative;background:var(--paper-slip);
  border:1px solid var(--line);border-radius:0;
  padding:24px 28px 26px;box-shadow:var(--slip-shadow);
  transform:rotate(var(--tilt,0deg));
}


.slip-year{font-size:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--blue);font-variant-numeric:tabular-nums}
.slip-role{font-size:29px;font-weight:700;letter-spacing:-.02em;line-height:1.12;
  color:var(--ink);margin-top:6px;text-wrap:balance}
.slip-sub{margin-top:7px;font-size:11px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:var(--pencil-light)}
/* The activities carry the stop on their own - a separate summary line above
   them only said the same thing twice. One run of text, not a table of rows:
   a stop should not need a whole screen of its own. */
.did{margin-top:15px;padding-top:13px;border-top:1px dotted var(--line);
  font-size:16px;line-height:1.62;color:var(--ink-body)}
.did b{font-weight:600;color:var(--ink)}
.did-h{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil-light);margin-bottom:5px}

.instr{margin-top:20px;border-top:1px dotted var(--line)}
.instr-row{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:start;
  padding:10px 0;border-bottom:1px dotted var(--line)}
.instr-row svg{width:26px;height:26px;fill:none;stroke:var(--blue);stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;opacity:.78}
.instr-row span{font-size:17px;line-height:1.45;color:var(--ink-body)}

.slip-aside{margin-top:14px;font-family:var(--hand);font-size:24px;font-weight:600;
  color:var(--pencil);line-height:1.2;transform:rotate(-.8deg);transform-origin:left center}

/* ---------- learnings, in the margin under each stop ---------- */
.margin{padding:14px 4px 0 6px}
.margin-h{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil-light);margin-bottom:12px}
.learns{display:flex;flex-wrap:wrap;gap:4px 26px}
.learn{display:flex;align-items:flex-start;gap:8px;
  font-family:var(--hand);font-size:24px;font-weight:600;line-height:1.15;
  transform:rotate(-1.5deg);transform-origin:left center}
.learn svg{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.learn-g{flex:none;display:grid;place-items:center;width:21px;height:21px;margin-top:4px;
  border-radius:6px;background:var(--tint)}
.learn-g svg{width:13px;height:13px;stroke:#fff;stroke-width:2}
.learn-job{color:var(--blue)}

.learn-own{color:var(--pencil)}

.learn-own .learn-t{border:1.4px solid var(--pencil);padding:0 8px 2px}

/* ---------- boarding pass stubs ----------
   Normal flow under the stop, so a stub can never land on a learning.
   The flight arc is drawn TO wherever layout put the stub. */
/* the relocations fly across the road and land in the empty half opposite
   the stop - which is what gives each arc a real distance to travel */
.stubs-col{grid-row:1;align-self:start;margin-top:62px;max-width:272px;width:100%}
.side-l .stubs-col{grid-column:3;justify-self:start;padding-left:8px}
.side-r .stubs-col{grid-column:1;justify-self:end;padding-right:8px}
.stubs{display:flex;flex-direction:column;gap:14px}
.stub{max-width:246px;transform:rotate(-2deg);transform-origin:left center;pointer-events:none}
.stub-card{position:relative;background:var(--paper-slip);border:1.4px solid var(--line);
  box-shadow:var(--slip-shadow);padding:10px 14px;display:flex;align-items:center}
.stub-card::before,.stub-card::after{content:"";position:absolute;left:62%;
  width:12px;height:6px;background:var(--paper);border:1.4px solid var(--line)}
.stub-card::before{top:-1px;border-top:0;border-radius:0 0 12px 12px}
.stub-card::after{bottom:-1px;border-bottom:0;border-radius:12px 12px 0 0}
.stub-perf{position:absolute;top:5px;bottom:5px;left:62%;border-left:1.4px dashed var(--line)}
.stub-code{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ink);white-space:nowrap}
.stub-yr{font-size:13px;font-weight:800;color:var(--blue);margin-left:auto;
  font-variant-numeric:tabular-nums;padding-left:12px}
.stub-line{font-family:var(--hand);font-size:22px;font-weight:600;color:var(--blue);
  margin-top:6px;line-height:1.12;transform:rotate(1.4deg);transform-origin:left center}

/* ---------- closing ---------- */
.closing{position:relative;background:var(--paper-aged);border-top:1px solid var(--line);
  padding:clamp(44px,7vh,76px) clamp(24px,5vw,80px) clamp(52px,8vh,88px);text-align:center}
.closing-line{font-family:var(--hand);font-size:clamp(2rem,4vw,3.1rem);font-weight:700;
  color:var(--blue);line-height:1.1;margin:0 auto;max-width:24ch;transform:rotate(-1deg)}
.closing-note{margin:24px auto 0;font-size:14px;color:var(--pencil-light);
  font-style:italic;max-width:54ch}
.closing-contact{margin-top:32px;display:flex;flex-wrap:wrap;justify-content:center;
  gap:10px 26px;font-size:15px}
.closing-contact a{color:var(--blue);text-decoration:none;border-bottom:1px solid transparent}
.closing-contact a:hover{border-bottom-color:var(--blue)}
.closing-contact a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* ---------- kit card ---------- */
.kit{position:fixed;right:24px;bottom:24px;width:236px;z-index:20;
  background:var(--paper-slip);border:1px solid var(--line);box-shadow:var(--slip-shadow);
  padding:16px 16px 14px;max-height:54vh;display:flex;flex-direction:column}
.kit-clip{position:absolute;top:-18px;left:14px;width:28px;height:46px;
  fill:none;stroke:var(--blue);stroke-width:2.2;opacity:.7}
.kit-h{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:11px}
.kit-t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink)}
.kit-n{font-size:22px;font-weight:800;color:var(--blue);
  font-variant-numeric:tabular-nums;line-height:1}
.kit-list{list-style:none;overflow:hidden;flex:1;min-height:0}
.kit-list li{font-family:var(--sans);font-size:13.5px;font-weight:700;line-height:1.3;
  letter-spacing:-.005em;color:var(--blue);opacity:0;clip-path:inset(0 100% 0 0);
  display:flex;align-items:center;gap:8px;padding:3.5px 0}
.kit-list li i{flex:none;display:grid;place-items:center;width:22px;height:22px;
  border-radius:6px;background:var(--tint)}
.kit-list li i svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.kit-list li.own span{border-bottom:1.5px dotted var(--pencil)}
.kit-list li.own{color:var(--pencil)}
.kit-list li.in{opacity:.82;clip-path:inset(0);transition:clip-path .38s ease,opacity .38s ease}
.kit-list li.in.newest{opacity:1}
.kit-foot{font-family:var(--hand);font-size:16px;color:var(--pencil);margin-top:8px;line-height:1.15}

/* ---------- ink-in ---------- */
.inks{opacity:0;transform:translateY(10px)}
.inks.is-inked{opacity:1;transform:none;
  transition:opacity .42s cubic-bezier(.2,.7,.2,1),transform .42s cubic-bezier(.2,.7,.2,1)}

@media (prefers-reduced-motion:reduce){
  .inks,.inks.is-inked{opacity:1;transform:none;transition:none}
  .kit-list li{opacity:.55;clip-path:inset(0);transition:none}
  .kit-list li.newest{opacity:1}
}

/* ---------- responsive ---------- */
@media (max-width:1240px){ :root{--road:180px;--half:440px} .slip-role{font-size:25px}
  .tiles{grid-template-columns:repeat(4,1fr);gap:12px} }
@media (max-width:980px){
  /* the road returns to the left edge and every stop lines up beside it */
  :root{--road:0px}
  .control{display:block;padding:44px 0 44px 116px}
  .stubs-col{margin-top:22px;max-width:660px;padding:0!important}
  .anchor{left:58px;top:88px}
  .half{max-width:660px}
  .kit{display:none}
  .cover,.closing{text-align:left}
  .cover-top{grid-template-columns:auto minmax(0,1fr);row-gap:16px}
  .firm{grid-column:2;justify-self:start;margin-top:4px}
  .portrait{width:96px;height:96px}
  .closing-line,.closing-note{margin-left:0;margin-right:0}
  .closing-contact{justify-content:flex-start}
}
@media (max-width:680px){
  body{font-size:17px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .cover-top{grid-template-columns:1fr}
  .firm{grid-column:1}
  .control{padding-left:64px}
  .anchor{left:30px}
  .slip{padding:22px 20px 24px}
  .slip-role{font-size:23px}
}

@media print{
  body{background:#fff;font-size:11px}
  .kit,svg.flights,svg.route{display:none}
  .control{display:block;padding:14px 0}
  .slip{transform:none;box-shadow:none;page-break-inside:avoid}
  .inks{opacity:1;transform:none}
}
</style>

<!-- ==================== COVER ==================== -->
<header class="cover">

  <div class="cover-inner">
    <div class="cover-top">
      <img class="portrait" src="{{IMG_PM}}" width="128" height="128" alt="Pavan Mankineni" />
      <div>
        <p class="cover-role" id="cvRole"></p>
        <h1 id="cvTitle"></h1>
      </div>
      <div class="firm" id="firmBox"></div>
    </div>
    <p class="cover-thesis" id="cvThesis"></p>
    <div class="tiles" id="tiles"></div>
  </div>
</header>

<!-- ==================== THE RIDE ==================== -->
<div class="page" id="page">
  <svg class="flights" id="flights" aria-hidden="true"></svg>
  <svg class="route" id="route" role="img"
       aria-label="A hand-drawn road winding down the middle of the page. Each career stage is a control point on it, with the stop itself on whichever side the road leans towards; four arcs branching off the road are international relocations."></svg>
  <div class="strip" id="strip"></div>
</div>

<!-- ==================== CLOSING ==================== -->
<footer class="closing">
  <p class="closing-line" id="clLine"></p>
  <p class="closing-note" id="clNote"></p>
  <div class="closing-contact">
    <a href="mailto:asinghmaan@arsa-infotech.com">asinghmaan@arsa-infotech.com</a>
    <a href="tel:+4915253988404">Telefon +49 152 539 884 04</a>
  </div>
</footer>

<!-- ==================== KIT CARD ==================== -->
<aside class="kit" id="kit" aria-label="Skills picked up along the way">
  <svg class="kit-clip" viewBox="0 0 28 46" aria-hidden="true">
    <path d="M20 12v22a6 6 0 0 1-12 0V10a9 9 0 0 1 18 0v24" />
  </svg>
  <div class="kit-h">
    <span class="kit-t" id="kitT">In the bag</span>
    <span class="kit-n" id="kitN">0</span>
  </div>
  <ul class="kit-list" id="kitList"></ul>
  <p class="kit-foot" id="kitFoot"></p>
</aside>

<script>
(function () {
'use strict';

/* ============================================================
   1. THE CONTENT.  Everything worth editing lives here.
   ------------------------------------------------------------
   A learning is [name, selfTaught].  selfTaught:true renders in
   PENCIL and boxed - "nobody asked me to learn this".  Flip the
   flag and the styling, the kit-card colour and the legend all
   follow.

   mark: the monogram on the badge beside each stop.
   logo: OPTIONAL path or data URI of a real logo file - if set it
         replaces the monogram. Left null deliberately; see
         docs/logos.md before adding any.
   ============================================================ */

var COVER = {
  role:  'SAP BI / HANA Solution Architect',
  title: 'Pavan Mankineni',
  thesis: 'Eleven tools from the SAP core. Six from the stack growing up beside it.',

var r1 = function (n) { return Math.round(n * 10) / 10; };

/* deterministic value noise - the same wobble every load, no Math.random */
function mkNoise(seed) {
  var r = new Float64Array(512), s = seed >>> 0, i;
  for (i = 0; i < 512; i++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; r[i] = s / 4294967296 * 2 - 1; }
  return function (t) {
    var k = Math.floor(t), f = t - k;
    var a = r[((k % 512) + 512) % 512], b = r[(((k + 1) % 512) + 512) % 512];
    return a + (b - a) * (f * f * (3 - 2 * f));
  };
}
var N_DRIFT = mkNoise(20060417), N_SLOW = mkNoise(77112), N_FAST = mkNoise(4242);

function el(tag, attrs, parent) {

  for (k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);

function polyPath(pts) {
  if (!pts.length) return '';
  var d = 'M' + r1(pts[0].x) + ' ' + r1(pts[0].y), i;
  for (i = 1; i < pts.length; i++) d += 'L' + r1(pts[i].x) + ' ' + r1(pts[i].y);
  return d;
}
/* dashes as real geometry, so a mask can reveal them one at a time */
function dashPath(pts, dash, gap) {
  var d = '', on = true, need = dash, started = false, i;
  for (i = 1; i < pts.length; i++) {
    var ax = pts[i - 1].x, ay = pts[i - 1].y, bx = pts[i].x, by = pts[i].y;
    var rem = Math.hypot(bx - ax, by - ay);
    while (rem > 1e-6) {
      var take = Math.min(rem, need), t = take / rem;
      var nx = ax + (bx - ax) * t, ny = ay + (by - ay) * t;
      if (on) {
        if (!started) { d += 'M' + r1(ax) + ' ' + r1(ay); started = true; }
        d += 'L' + r1(nx) + ' ' + r1(ny);
      }
      ax = nx; ay = ny; rem -= take; need -= take;
      if (need <= 1e-6) { on = !on; need = on ? dash : gap; if (!on) started = false; }
    }
  }
  return d;
}
var cubicAt = function (p, t) {

/* ============================================================
   4. THE ROAD
   The road winds down the middle. Its lateral offset is driven by
   knots - one per stop, leaning towards whichever side that stop
   sits on - so the curve is not decorative: the road bends
   because there is somewhere to visit.
   ============================================================ */

var HALF_W = 11, STEP = 7;
var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
var CX = 0, AMP = 70, KNOTS = [], pageTop = 0, pageH = 1, pageW = 1;
var YEARMAP = [], FRONT = [], MASK = null, building = false;

function offAt(y) {
  if (!KNOTS.length) return 0;
  if (y <= KNOTS[0].y) return KNOTS[0].off;
  for (var i = 0; i < KNOTS.length - 1; i++) {
    var a = KNOTS[i], b = KNOTS[i + 1];
    if (y >= a.y && y <= b.y) {
      var t = (b.y - a.y) ? (y - a.y) / (b.y - a.y) : 0;
      return a.off + (b.off - a.off) * (1 - Math.cos(t * Math.PI)) / 2;
    }
  }
  return KNOTS[KNOTS.length - 1].off;
}
function roadXAt(y) { return CX + offAt(y) + N_DRIFT(y / 430) * 5; }

function kerbPts(y0, y1, off, na, nb) {
  var out = [], y;
  for (y = y0; y < y1; y += STEP)
    out.push({ x: roadXAt(y) + off + na(y / 95) * 1.2 + nb(y / 26) * 0.45, y: y });
  out.push({ x: roadXAt(y1) + off + na(y1 / 95) * 1.2 + nb(y1 / 26) * 0.45, y: y1 });
  return out;
}
/* after the fork the two lanes peel away from the trunk toward their own stop */
function laneXAt(y, fy, target) {
  var u = clamp((y - fy) / 190, 0, 1), s = u * u * (3 - 2 * u);
  var base = offAt(fy);
  return CX + base + (target - base) * s + N_DRIFT(y / 430) * 5;
}
function lanePts(y0, y1, fy, target, off, na, nb) {
  var out = [], y;
  for (y = y0; y < y1; y += STEP)
    out.push({ x: laneXAt(y, fy, target) + off + na(y / 95) * 1.2 + nb(y / 26) * 0.45, y: y });
  out.push({ x: laneXAt(y1, fy, target) + off + na(y1 / 95) * 1.2 + nb(y1 / 26) * 0.45, y: y1 });
  return out;
}

function measure() {
  var pr = page.getBoundingClientRect();
  pageTop = pr.top + window.scrollY;
  pageW = pr.width; pageH = pr.height;

  var blocks = [].map.call(strip.querySelectorAll('[data-y0]'), function (e) {
    var r = e.getBoundingClientRect();
    return { top: r.top + window.scrollY - pageTop, h: r.height,
             y0: +e.dataset.y0, y1: +e.dataset.y1 };
  });
  var ctls = [].map.call(strip.querySelectorAll('[data-ctl]'), function (e) {
    var a = e.querySelector('.anchor').getBoundingClientRect();
    var h = e.querySelector('.half').getBoundingClientRect();
    var left = e.classList.contains('side-l');
    return { el: e, idx: +e.dataset.idx,
             lane: e.dataset.lane === undefined ? null : +e.dataset.lane,
             lanePos: e.dataset.lanePos === undefined ? null : +e.dataset.lanePos,
             side: left ? -1 : 1,
             y: a.top + window.scrollY - pageTop,
             ax: a.left - pr.left,
             near: (left ? h.right : h.left) - pr.left };
  });
  return { blocks: blocks, ctls: ctls };
}

function buildYearMap(blocks) {
  YEARMAP = [];
  blocks.forEach(function (b) {
    YEARMAP.push({ year: b.y0, y: b.top }, { year: b.y1, y: b.top + b.h });
  });
  YEARMAP.sort(function (a, b) { return a.y - b.y; });
}
function yearToY(yr) {
  if (!YEARMAP.length) return 0;
  for (var i = 0; i < YEARMAP.length - 1; i++) {
    var a = YEARMAP[i], b = YEARMAP[i + 1];
    if (yr >= a.year && yr <= b.year && b.year > a.year)
      return a.y + (b.y - a.y) * (yr - a.year) / (b.year - a.year);
  }
  return YEARMAP[YEARMAP.length - 1].y;
}

function build() {
  building = true;
  var m = measure();
  if (!m.ctls.length) { building = false; return; }
  buildYearMap(m.blocks);

  CX = m.ctls[0].ax;
  var roadW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--road')) || 0;
  AMP = clamp(roadW / 2 - 34, 10, 92);

  while (routeSvg.firstChild) routeSvg.removeChild(routeSvg.firstChild);
  while (flightSvg.firstChild) flightSvg.removeChild(flightSvg.firstChild);

  [routeSvg, flightSvg].forEach(function (s) {
    s.setAttribute('width', pageW);
    s.setAttribute('height', pageH);
    s.setAttribute('viewBox', '0 0 ' + pageW + ' ' + pageH);
  });

  var laned = m.ctls.filter(function (c) { return c.lane !== null; });
  var trunk = m.ctls.filter(function (c) { return c.lane === null; });
  var startY = m.ctls[0].y - 74;
  var endY = pageH - 18;

  /* Each lane leaves the trunk at its OWN stop rather than all of them
     branching at the first one - otherwise a road that starts in 2025 is
     already drawn back in 2024. The trunk therefore has to survive as far
     as the last branch, with lanes peeling off it one at a time. */
  var BRANCH = 96;
  laned.forEach(function (c) { c.fy = c.y - BRANCH; });
  var forkYs = laned.map(function (c) { return c.fy; });
  var firstFork = laned.length ? Math.min.apply(null, forkYs) : endY;
  var lastFork  = laned.length ? Math.max.apply(null, forkYs) : endY;

  /* the knots that make the road wind - it stops winding once it starts splitting */
  KNOTS = [{ y: startY, off: 0 }];
  trunk.forEach(function (c) { KNOTS.push({ y: c.y, off: c.side * AMP }); });
  KNOTS.push({ y: firstFork, off: 0 });

  /* ---- reveal mask: a band that follows the reading eye down the page ---- */
  var defs = el('defs', {}, routeSvg);
  var grad = el('linearGradient', { id: 'fadeG', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  el('stop', { offset: '0', 'stop-color': '#fff' }, grad);
  el('stop', { offset: '1', 'stop-color': '#000' }, grad);
  var mask = el('mask', { id: 'revealM', maskUnits: 'userSpaceOnUse',
                          x: 0, y: 0, width: pageW, height: pageH }, defs);
  var mSolid = el('rect', { x: 0, y: 0, width: pageW, height: 0, fill: '#fff' }, mask);
  var mFade  = el('rect', { x: 0, y: 0, width: pageW, height: 54, fill: 'url(#fadeG)' }, mask);
  var G = el('g', { mask: 'url(#revealM)' }, routeSvg);

  /* ---- the trunk ---- */
  el('path', { class: 'kerb', d: polyPath(kerbPts(startY, lastFork, -HALF_W, N_SLOW, N_FAST)) }, G);
  el('path', { class: 'kerb', d: polyPath(kerbPts(startY, lastFork,  HALF_W, N_SLOW, N_FAST)) }, G);
  el('path', { class: 'kerb kerb-2', d: polyPath(kerbPts(startY, lastFork, -HALF_W, N_FAST, N_SLOW)) }, G);
  el('path', { class: 'kerb kerb-2', d: polyPath(kerbPts(startY, lastFork,  HALF_W, N_FAST, N_SLOW)) }, G);
  el('path', { class: 'centre', d: dashPath(kerbPts(startY, lastFork, 0, N_SLOW, N_FAST), 13, 16) }, G);

  /* ---- the fork: two roads, one to each of the current stops ---- */
  var LANEOFF = {};
  laned.forEach(function (c) {
    var pos = c.lanePos !== null ? c.lanePos : c.side;   /* side is only ever -1/+1 */
    LANEOFF[c.lane] = pos * AMP;
  });
  if (laned.length) {
    laned.forEach(function (c) {
      var t = LANEOFF[c.lane];
      el('path', { class: 'kerb', d: polyPath(lanePts(c.fy, endY, c.fy, t, -HALF_W, N_SLOW, N_FAST)) }, G);
      el('path', { class: 'kerb', d: polyPath(lanePts(c.fy, endY, c.fy, t,  HALF_W, N_SLOW, N_FAST)) }, G);
      el('path', { class: 'centre', d: dashPath(lanePts(c.fy, endY, c.fy, t, 0, N_SLOW, N_FAST), 13, 16) }, G);
    });
    /* anchored where the THIRD road appears, not the first split - at
       firstFork only two roads exist and the label would be asserting three
       over a two-road picture */
    var bx = roadXAt(lastFork - 14);
    el('text', { class: 'brace-t', x: r1(bx), y: r1(lastFork - 20) }, G)
      .appendChild(document.createTextNode('three, at once'));
  }

  /* ---- control markers, distance figures, leader lines ---- */
  m.ctls.forEach(function (c) {
    var cx = c.lane !== null ? laneXAt(c.y, c.fy, LANEOFF[c.lane]) : roadXAt(c.y);
    var g = el('g', {}, G);
    var edge = cx + c.side * 14;
    var target = c.near - c.side * 9;
    el('path', { class: 'leader', d: 'M' + r1(edge) + ' ' + r1(c.y) +
                 ' Q' + r1((edge + target) / 2) + ' ' + r1(c.y - 8) + ' ' + r1(target) + ' ' + r1(c.y) }, g);
    el('circle', { class: 'ctl-ring', cx: r1(cx), cy: r1(c.y), r: 13 }, g);
    el('circle', { class: 'ctl-dot', cx: r1(cx), cy: r1(c.y), r: 4.4 }, g);

  });

  /* ---- the four flights: drawn TO wherever layout put each stub ---- */
  var fdefs = el('defs', {}, flightSvg);
  var pr2 = page.getBoundingClientRect();
  FRONT = [];
  FLIGHTS.forEach(function (f, i) {
    var stub = page.querySelector('.stub[data-fyear="' + f.year + '"]');
    if (!stub) return;
    var host = stub.closest('[data-ctl]');
    var dir = host && host.classList.contains('side-l') ? 1 : -1;
    var sr = stub.getBoundingClientRect();
    var card = stub.querySelector('.stub-card').getBoundingClientRect();

    var dy = yearToY(f.year);
    var dx = roadXAt(dy) + dir * 14;
    var ax = (dir < 0 ? sr.right : sr.left) - pr2.left + dir * 12;
    var ay = card.top - pr2.top + card.height / 2;
    if (Math.abs(ax - dx) < 90) return;      /* no room: skip rather than scribble */

    /* Bow the arc perpendicular to the chord and always upward. Departures
       spread down the stage while the stubs stack at its top, so anchoring the
       bow to whichever end is higher produces loops - this does not. */
    var vx = ax - dx, vy = ay - dy;
    var len = Math.hypot(vx, vy) || 1;
    var px = -vy / len, py = vx / len;
    if (py > 0) { px = -px; py = -py; }
    var bow = f.rise;
    var P = [
      { x: dx,                                y: dy },
      { x: dx + vx * 0.25 + px * bow * 0.95,  y: dy + vy * 0.25 + py * bow * 0.95 },
      { x: dx + vx * 0.75 + px * bow * 0.95,  y: dy + vy * 0.75 + py * bow * 0.95 },
      { x: ax,                                y: ay }
    ];
    var pts = [], t;
    for (t = 0; t <= 96; t++) pts.push(cubicAt(P, t / 96));

    var mk = el('mask', { id: 'flM' + i, maskUnits: 'userSpaceOnUse',
                          x: 0, y: 0, width: pageW, height: pageH }, fdefs);
    var mr = el('rect', { x: r1(dx), y: 0, width: 0, height: pageH, fill: '#fff' }, mk);
    var fg = el('g', { mask: 'url(#flM' + i + ')' }, flightSvg);
    el('path', { class: 'fl-trail', d: polyPath(pts) }, fg);

    var tip = cubicAt(P, 0.55), tan = cubicTan(P, 0.55);
    var ang = Math.atan2(tan.y, tan.x) * 180 / Math.PI;
    el('path', { class: 'plane', d: 'M11 0 L-6 5 L-3 0.8 L-9 1.4 L-11 -0.4 L-3 -0.9 L-6 -5 Z',
                 transform: 'translate(' + r1(tip.x) + ' ' + r1(tip.y) + ') rotate(' + r1(ang) + ')' }, fg);

    FRONT.push({ mr: mr, dx: dx, dir: dir, span: Math.abs(vx) + 40,
                 dy: Math.min(dy, ay), win: Math.max(140, Math.abs(vy) + f.rise) });
  });

  MASK = { solid: mSolid, fade: mFade };
  lastFront = -1;
  paint();
  requestAnimationFrame(function () { building = false; });
}

/* ---- scroll: one pass per frame, no easing, never fights the wheel ---- */
var lastFront = -1, queued = false;

function paint() {
  queued = false;
  if (!MASK) return;
  var front = clamp(window.scrollY + window.innerHeight * 0.62 - pageTop, 0, pageH);
  if (Math.abs(front - lastFront) < 0.5) return;
  lastFront = front;

  MASK.solid.setAttribute('height', r1(front));
  MASK.fade.setAttribute('y', r1(front));

  FRONT.forEach(function (s) {
    var w = clamp((front - s.dy) / s.win, 0, 1) * s.span;
    s.mr.setAttribute('width', r1(w));
    s.mr.setAttribute('x', r1(s.dir < 0 ? s.dx - w : s.dx));
  });

}
function onScroll() { if (!queued) { queued = true; requestAnimationFrame(paint); } }

function fullyDrawn() {
  if (!MASK) return;
  MASK.solid.setAttribute('height', pageH);
  MASK.fade.setAttribute('y', pageH);
  FRONT.forEach(function (s) {
    s.mr.setAttribute('width', s.span);
    s.mr.setAttribute('x', r1(s.dir < 0 ? s.dx - s.span : s.dx));
  });
}
function attachScroll() {
  window.removeEventListener('scroll', onScroll);
  if (reduceMQ.matches) { fullyDrawn(); return; }
  window.addEventListener('scroll', onScroll, { passive: true });
  lastFront = -1; paint();
}

/* ---- entries ink in once, and never un-ink ---- */
var seen = new WeakSet();
function inkNow(n) {
  n.classList.add('is-inked');
  var sec = n.closest('[data-ctl]');
  if (sec && n.classList.contains('slip') && !seen.has(sec)) {
    seen.add(sec);
    if (CONTROLS[+sec.dataset.idx]) addToKit(CONTROLS[+sec.dataset.idx]);
  }
}
var io = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) {
    if (!e.isIntersecting) return;
    inkNow(e.target);
    io.unobserve(e.target);
  });
}, { rootMargin: '0px 0px -30% 0px', threshold: 0.02 });

/* Anything at or above the fold inks immediately. IntersectionObserver never
   fires for elements scrolled past without ever being visible, so a reload at
   a scrolled position would otherwise leave everything above permanently
   blank - a real hazard mid-presentation. */
function observeAll() {
  document.querySelectorAll('.inks:not(.is-inked)').forEach(function (n) {
    if (n.getBoundingClientRect().top < window.innerHeight) inkNow(n);
    else io.observe(n);
  });
}

/* ---- rebuild triggers ---- */
var bt = 0;
function schedule() { clearTimeout(bt); bt = setTimeout(function () { build(); observeAll(); }, 70); }
var ro = new ResizeObserver(function () { if (!building) schedule(); });
strip.querySelectorAll('[data-ctl]').forEach(function (n) { ro.observe(n); });
ro.observe(page);
window.addEventListener('resize', schedule);
reduceMQ.addEventListener('change', attachScroll);

function start() { build(); observeAll(); attachScroll(); }
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(start);
  setTimeout(function () { if (!MASK) start(); }, 1800);
} else {
  window.addEventListener('load', start);
}
})();
</script>
