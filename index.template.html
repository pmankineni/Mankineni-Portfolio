<title>The Brevet Book</title>
<style>
/* ============================================================
   THE BREVET BOOK - Pavan Mankineni
   A randonneur roadbook. Eighteen years read as one long ride:
   seven controls, four flights, two blank stretches.
   ============================================================ */

@font-face{
  font-family:'Inter';src:url({{FONT_INTER}}) format('woff2');
  font-weight:400 800;font-style:normal;font-display:block;
}
@font-face{
  font-family:'Caveat';src:url({{FONT_CAVEAT}}) format('woff2');
  font-weight:400 700;font-style:normal;font-display:block;
}

:root{
  --paper:#faf6ec;
  --paper-slip:#fffdf6;
  --paper-aged:#f2ead8;
  --grid:rgba(22,32,58,.055);
  --grid-major:rgba(22,32,58,.085);
  --margin-rule:#c4614a;
  --ink:#16203a;
  --ink-body:#3a4356;
  --pencil:#5e5849;
  --pencil-light:#7a6f53;
  --blue:#2c5bd6;
  --blue-deep:#1c40a8;
  --blue-wash:#e9f0ff;
  --stamp:#b4442f;
  --tape:rgba(199,180,130,.66);
  --tape-edge:rgba(239,230,206,.9);
  --line:rgba(22,32,58,.12);

  --stamp-opacity:.55;
  --stamp-blend:multiply;
  --slip-shadow:0 1px 0 rgba(22,32,58,.06), 0 10px 22px -14px rgba(22,32,58,.42);

  --sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --hand:'Caveat','Segoe Script',cursive;

  --rail:132px;
  --rule-x:158px;
  --strip-pad:198px;
  --gutter:296px;
  --draw:0;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#191713;
    --paper-slip:#211e19;
    --paper-aged:#26221b;
    --grid:rgba(250,246,236,.05);
    --grid-major:rgba(250,246,236,.08);
    --margin-rule:#8e4536;
    --ink:#f2ede1;
    --ink-body:#cfc8ba;
    --pencil:#9a9284;
    --pencil-light:#8b8375;
    --blue:#7fa5ff;
    --blue-deep:#a8c2ff;
    --blue-wash:rgba(127,165,255,.14);
    --stamp:#e2735a;
    --tape:rgba(120,108,80,.42);
    --tape-edge:rgba(150,136,102,.55);
    --line:rgba(242,237,225,.14);
    --stamp-blend:screen;
    --slip-shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --paper:#191713;
  --paper-slip:#211e19;
  --paper-aged:#26221b;
  --grid:rgba(250,246,236,.05);
  --grid-major:rgba(250,246,236,.08);
  --margin-rule:#8e4536;
  --ink:#f2ede1;
  --ink-body:#cfc8ba;
  --pencil:#9a9284;
  --pencil-light:#8b8375;
  --blue:#7fa5ff;
  --blue-deep:#a8c2ff;
  --blue-wash:rgba(127,165,255,.14);
  --stamp:#e2735a;
  --tape:rgba(120,108,80,.42);
  --tape-edge:rgba(150,136,102,.55);
  --line:rgba(242,237,225,.14);
  --stamp-blend:screen;
  --slip-shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.75);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--sans);
  font-size:18px;
  line-height:1.5;
  color:var(--ink-body);
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(to right,var(--grid-major) 0 1px,transparent 1px 120px),
    repeating-linear-gradient(to bottom,var(--grid-major) 0 1px,transparent 1px 120px);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- cover ---------- */
.cover{
  position:relative;background:var(--paper-aged);
  border-bottom:1px solid var(--line);
  padding:clamp(56px,9vh,104px) clamp(24px,5vw,80px) clamp(52px,8vh,92px) var(--strip-pad);
  overflow:hidden;
}
.rule-v{
  position:absolute;top:0;bottom:0;left:var(--rule-x);width:1.5px;
  background:var(--margin-rule);opacity:.5;
}
.cover-inner{max-width:900px;position:relative;z-index:2}
.cover-stamp{
  position:absolute;right:clamp(16px,6vw,110px);top:50%;
  transform:translateY(-50%) rotate(-9deg);
  width:190px;height:190px;opacity:var(--stamp-opacity);
  mix-blend-mode:var(--stamp-blend);pointer-events:none;z-index:1;
}
.cover h1{
  font-size:clamp(2.6rem,5.4vw,4.2rem);font-weight:800;letter-spacing:-.03em;
  line-height:1.02;color:var(--ink);text-wrap:balance;
}
.cover-role{
  margin-top:14px;font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--pencil-light);
}
.cover-sub{
  font-family:var(--hand);font-weight:700;color:var(--blue);
  font-size:clamp(1.8rem,3vw,2.6rem);line-height:1.15;margin-top:24px;
  transform:rotate(-1.2deg);transform-origin:left center;
}
.cover-hook{font-size:19px;color:var(--ink-body);max-width:54ch;margin-top:24px}
.cover-note{margin-top:30px;font-size:13px;color:var(--pencil-light);font-style:italic}

/* ---------- the page ---------- */
.page{position:relative}
svg.flights{position:absolute;top:0;left:0;z-index:0;pointer-events:none}
svg.route{position:absolute;top:0;left:0;z-index:2;pointer-events:none}

.route .kerb{fill:none;stroke:var(--blue);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.route .kerb-2{stroke-width:1.4;opacity:.45}
.route .centre{fill:none;stroke:var(--blue);stroke-width:1.7;stroke-linecap:round;opacity:.6}
.route .gapkerb{fill:none;stroke:var(--blue);stroke-width:1.4;stroke-linecap:round;opacity:.42}
.route .ctl-ring{fill:var(--paper);stroke:var(--blue);stroke-width:2.4}
.route .ctl-dot{fill:var(--blue)}
.route .leader{fill:none;stroke:var(--blue);stroke-width:1.3;opacity:.38;stroke-dasharray:3 4}
/* paint-order knocks a paper-coloured halo out of the road behind the figure,
   the way a distance label works on a real map */
.route .km,.route .km-d{
  stroke:var(--paper);stroke-width:4;paint-order:stroke fill;
  stroke-linejoin:round;font-variant-numeric:tabular-nums;
}
.route .km{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.06em;
  fill:var(--pencil-light)}
.route .km-d{font-family:var(--sans);font-size:11px;font-weight:500;fill:var(--pencil-light)}
.route .brace{fill:none;stroke:var(--blue);stroke-width:1.5;opacity:.45}
.route .brace-t{font-family:var(--hand);font-size:22px;font-weight:600;fill:var(--blue);opacity:.9}

.flights .fl-trail{fill:none;stroke:var(--blue);stroke-width:2;opacity:.72;
  stroke-dasharray:7 8;stroke-linecap:round}
.flights .plane{fill:var(--blue);opacity:.95}

/* ---------- controls ---------- */
.strip{position:relative;z-index:3;padding:0 clamp(24px,4vw,64px) 0 var(--strip-pad)}
.control,.gap{position:relative;padding:54px 0}
.anchor{position:absolute;left:0;top:92px;width:0;height:0}
.control-grid{display:grid;grid-template-columns:minmax(0,1fr) var(--gutter);
  gap:44px;align-items:start;max-width:1140px}

.slip{
  position:relative;background:var(--paper-slip);
  border:1px solid var(--line);border-radius:0;
  padding:30px 34px 46px;box-shadow:var(--slip-shadow);
  transform:rotate(var(--tilt,0deg));
}
.tape{
  position:absolute;width:78px;height:26px;pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(255,255,255,.16) 0 3px, var(--tape) 3px calc(100% - 3px), rgba(0,0,0,.05) calc(100% - 3px));
  background-color:var(--tape);
  border-top:1px solid var(--tape-edge);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.tape-a{top:-13px;left:-24px;transform:rotate(-42deg);box-shadow:0 1px 3px rgba(22,32,58,.13)}
.tape-b{bottom:-13px;right:-22px;transform:rotate(-38deg);box-shadow:0 1px 3px rgba(22,32,58,.13)}

.slip-year{font-size:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--blue);font-variant-numeric:tabular-nums}
.slip-role{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.12;
  color:var(--ink);margin-top:8px;text-wrap:balance}
.slip-sub{margin-top:7px;font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--pencil-light)}
.slip-doing{margin-top:16px;font-size:17px;line-height:1.5;color:var(--ink-body);max-width:52ch}

.instr{margin-top:22px;border-top:1px dotted var(--line)}
.instr-row{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:start;
  padding:11px 0;border-bottom:1px dotted var(--line)}
.instr-row svg{width:26px;height:26px;fill:none;stroke:var(--blue);stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;opacity:.78}
.instr-row span{font-size:17px;line-height:1.45;color:var(--ink-body)}

.slip-aside{margin-top:20px;font-family:var(--hand);font-size:24px;font-weight:600;
  color:var(--pencil);line-height:1.2;transform:rotate(-.8deg);transform-origin:left center}

.stamp{
  position:absolute;right:-34px;bottom:-30px;width:132px;height:132px;
  mix-blend-mode:var(--stamp-blend);transform:rotate(-12deg);
  pointer-events:none;z-index:0;opacity:0;
}
.stamp text{font-family:var(--sans);font-weight:700;font-size:9px;letter-spacing:.1em}
/* Slip content sits above the stamp, so the stamp reads as printed UNDER the
   text the way a real control stamp does. .tape is excluded - it needs to keep
   its own position:absolute. */
.slip > :not(.stamp):not(.tape){position:relative;z-index:1}

/* ---------- margin learnings ---------- */
.margin{padding-top:6px}
.margin-h{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil-light);margin-bottom:14px}
.learn{display:flex;align-items:flex-start;gap:9px;margin-bottom:13px;
  font-family:var(--hand);font-size:26px;font-weight:600;line-height:1.15;
  transform:rotate(-1.5deg);transform-origin:left center}
.learn svg{flex:none;width:15px;height:15px;margin-top:7px;fill:none;
  stroke-width:1.8;stroke-linecap:round}
.learn-job{color:var(--blue)}
.learn-job svg{stroke:var(--blue)}
.learn-own{color:var(--pencil)}
.learn-own svg{stroke:var(--pencil)}
.learn-own .learn-t{border:1.4px solid var(--pencil);padding:0 8px 2px}
.margin-foot{margin-top:18px;padding-top:12px;border-top:1px dotted var(--line);
  font-family:var(--hand);font-size:21px;color:var(--pencil);line-height:1.2}

/* ---------- gap stretches ---------- */
.gap{padding:40px 0}
.gap-year{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil-light);font-variant-numeric:tabular-nums}
.gap-line{font-family:var(--hand);font-size:26px;font-weight:600;color:var(--pencil);
  margin-top:6px;transform:rotate(-.9deg);transform-origin:left center}

/* ---------- boarding pass stubs ----------
   These live in normal flow inside the margin column, so a stub can never
   land on top of a learning. The flight arc is drawn TO wherever layout
   put the stub, rather than the stub being placed at the arc. */
.stub{position:relative;z-index:4;max-width:236px;margin-top:18px;
  transform:rotate(-2deg);transform-origin:left center;pointer-events:none}
.learn + .stub{margin-top:24px;padding-top:18px;border-top:1px dotted var(--line)}
.stub-card{position:relative;background:var(--paper-slip);border:1.4px solid var(--line);
  box-shadow:var(--slip-shadow);padding:11px 14px;display:flex;align-items:center}
.stub-card::before,.stub-card::after{content:"";position:absolute;left:62%;
  width:12px;height:6px;background:var(--paper);border:1.4px solid var(--line)}
.stub-card::before{top:-1px;border-top:0;border-radius:0 0 12px 12px}
.stub-card::after{bottom:-1px;border-bottom:0;border-radius:12px 12px 0 0}
.stub-perf{position:absolute;top:5px;bottom:5px;left:62%;border-left:1.4px dashed var(--line)}
.stub-code{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ink);white-space:nowrap}
.stub-yr{font-size:13px;font-weight:800;color:var(--blue);margin-left:auto;
  font-variant-numeric:tabular-nums;padding-left:12px}
.stub-line{font-family:var(--hand);font-size:23px;font-weight:600;color:var(--blue);
  margin-top:7px;line-height:1.1;transform:rotate(1.4deg);transform-origin:left center}

/* ---------- closing ---------- */
.closing{position:relative;background:var(--paper-aged);border-top:1px solid var(--line);
  padding:clamp(56px,9vh,96px) clamp(24px,5vw,80px) clamp(72px,11vh,120px) var(--strip-pad)}
.closing-place{font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--pencil-light)}
.closing-line{font-family:var(--hand);font-size:clamp(2rem,4vw,3.1rem);font-weight:700;
  color:var(--blue);line-height:1.1;margin-top:12px;max-width:20ch;
  transform:rotate(-1deg);transform-origin:left center}
.closing-note{margin-top:26px;font-size:14px;color:var(--pencil-light);
  font-style:italic;max-width:44ch}
.closing-contact{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px 26px;font-size:15px}
.closing-contact a{color:var(--blue);text-decoration:none;border-bottom:1px solid transparent}
.closing-contact a:hover{border-bottom-color:var(--blue)}
.closing-contact a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* ---------- kit card ---------- */
.kit{position:fixed;right:26px;bottom:26px;width:240px;z-index:20;
  background:var(--paper-slip);border:1px solid var(--line);box-shadow:var(--slip-shadow);
  padding:16px 16px 14px;max-height:54vh;display:flex;flex-direction:column}
.kit-clip{position:absolute;top:-18px;left:14px;width:28px;height:46px;
  fill:none;stroke:var(--blue);stroke-width:2.2;opacity:.7}
.kit-h{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:11px}
.kit-t{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil-light)}
.kit-n{font-size:22px;font-weight:800;color:var(--blue);
  font-variant-numeric:tabular-nums;line-height:1}
.kit-list{list-style:none;overflow:hidden;flex:1;min-height:0}
.kit-list li{font-family:var(--hand);font-size:19px;font-weight:600;line-height:1.28;
  color:var(--blue);opacity:0;clip-path:inset(0 100% 0 0)}
.kit-list li.own{color:var(--pencil)}
.kit-list li.in{opacity:.5;clip-path:inset(0);
  transition:clip-path .38s ease,opacity .38s ease}
.kit-list li.in.newest{opacity:1}
.kit-odo{margin-top:10px;padding-top:9px;border-top:1px dotted var(--line);
  font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--pencil-light);
  font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.kit-foot{font-family:var(--hand);font-size:16px;color:var(--pencil);margin-top:8px;line-height:1.15}

/* ---------- theme toggle ---------- */
.lamp{position:fixed;top:20px;right:24px;z-index:30;width:42px;height:42px;
  background:var(--paper-slip);border:1px solid var(--line);cursor:pointer;
  display:grid;place-items:center;box-shadow:var(--slip-shadow)}
.lamp svg{width:22px;height:22px;fill:none;stroke:var(--blue);stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.lamp:hover{border-color:var(--blue)}
.lamp:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* ---------- ink-in ---------- */
.inks{opacity:0;transform:translateY(10px)}
.inks.is-inked{opacity:1;transform:none;
  transition:opacity .42s cubic-bezier(.2,.7,.2,1),transform .42s cubic-bezier(.2,.7,.2,1)}
.is-inked .stamp{opacity:var(--stamp-opacity);
  transition:opacity .3s ease .18s,transform .3s cubic-bezier(.34,1.4,.64,1) .18s}

@media (prefers-reduced-motion:reduce){
  .inks,.inks.is-inked{opacity:1;transform:none;transition:none}
  .stamp,.is-inked .stamp{opacity:var(--stamp-opacity);transition:none}
  .kit-list li{opacity:.55;clip-path:inset(0);transition:none}
  .kit-list li.newest{opacity:1}
}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  :root{--rail:78px;--rule-x:96px;--strip-pad:126px;--gutter:0px}
  .control-grid{grid-template-columns:minmax(0,1fr);gap:0}
  .margin{margin-top:18px;padding:20px 24px;background:var(--paper-slip);
    border:1px dashed var(--line)}
  .stub{max-width:330px}
  .kit{display:none}
}
@media (max-width:760px){
  body{font-size:17px}
  :root{--rail:44px;--rule-x:58px;--strip-pad:76px}
  .slip{padding:24px 22px 38px}
  .slip-role{font-size:25px}
  .stamp{width:104px;height:104px;right:-14px;bottom:-18px}
  .lamp{top:12px;right:12px}
}

@media print{
  body{background:#fff;font-size:11px}
  .kit,.lamp,svg.flights,svg.route{display:none}
  :root{--strip-pad:0px;--gutter:220px}
  .control,.gap{page-break-inside:avoid;padding:16px 0}
  .slip{transform:none;box-shadow:none}
  .inks{opacity:1;transform:none}
}
</style>

<button class="lamp" id="lamp" type="button" aria-label="Switch light or dark">
  <svg viewBox="0 0 24 24" aria-hidden="true">

  </svg>
</button>

<!-- ==================== COVER ==================== -->
<header class="cover">

<script>
(function () {
'use strict';

/* ============================================================
   1. THE CONTENT.  Everything Pavan might want to edit is here.
   ------------------------------------------------------------
   A learning is [name, selfTaught].  selfTaught:true renders in
   PENCIL and boxed - "nobody asked me to learn this".  Flip the

    var bx = pts[i].x, by = pts[i].y;
    var rem = Math.hypot(bx - ax, by - ay);
    while (rem > 1e-6) {
      var take = Math.min(rem, need);
      var t = take / rem;
      var nx = ax + (bx - ax) * t, ny = ay + (by - ay) * t;

    var a = YEARMAP[i], b = YEARMAP[i + 1];
    if (yr >= a.year && yr <= b.year && b.year > a.year)

    var a = YEARMAP[i], b = YEARMAP[i + 1];
    if (y >= a.y && y <= b.y && b.y > a.y)

                 ' Q' + r1((c.colX + cx) / 2) + ' ' + r1(c.y - 7) + ' ' + r1(c.colX - 10) + ' ' + r1(c.y) }, g);
    el('circle', { class: 'ctl-ring', cx: r1(cx), cy: r1(c.y), r: 13 }, g);
    el('circle', { class: 'ctl-dot', cx: r1(cx), cy: r1(c.y), r: 4.4 }, g);
    var yr = +c.el.dataset.y0;
    var km = (yr - KM_ZERO) * KM_PER_YEAR;
    var tx = el('text', { class: 'km', x: r1(cx), y: r1(c.y - 26), 'text-anchor': 'middle' }, g);
    tx.appendChild(document.createTextNode('KM ' + km.toLocaleString('en-GB')));
    if (i > 0) {
      var prev = (+m.ctls[i - 1].el.dataset.y0 - KM_ZERO) * KM_PER_YEAR;
      var td = el('text', { class: 'km-d', x: r1(cx), y: r1(c.y + 33), 'text-anchor': 'middle' }, g);
      td.appendChild(document.createTextNode('+' + (km - prev) + ' km'));
    }
  });

  /* ---- the four flights ----
     Each arc is drawn from the road to wherever layout put its stub, so the
     drawing follows the text rather than the text dodging the drawing. */
  var fdefs = el('defs', {}, flightSvg);
  var pr2 = page.getBoundingClientRect();
  FRONT = [];
  FLIGHTS.forEach(function (f, i) {
    var stub = page.querySelector('.stub[data-fyear="' + f.year + '"]');
    if (!stub) return;
    var sr = stub.getBoundingClientRect();
    var card = stub.querySelector('.stub-card').getBoundingClientRect();

    var dy = yearToY(f.year);
    var dx = roadXAt(dy) + 14;
    var ax = sr.left - pr2.left - 12;                  /* land just left of the stub */
    var ay = card.top - pr2.top + card.height / 2;
    if (ax - dx < 120) return;                          /* no room: skip rather than scribble */

    var run = ax - dx;
    var top = Math.min(dy, ay) - f.rise;                /* bow above both ends */
    var P = [
      { x: dx,               y: dy },
      { x: dx + run * 0.24,  y: top + f.rise * 0.10 },
      { x: dx + run * 0.70,  y: top + f.rise * 0.34 },
      { x: ax,               y: ay }
    ];
    var pts = [], t;
    for (t = 0; t <= 96; t++) pts.push(cubicAt(P, t / 96));

    var mk = el('mask', { id: 'flM' + i, maskUnits: 'userSpaceOnUse',
                          x: 0, y: 0, width: pageW, height: pageH }, fdefs);
    var mr = el('rect', { x: r1(dx - 8), y: 0, width: 0, height: pageH, fill: '#fff' }, mk);
    var fg = el('g', { mask: 'url(#flM' + i + ')' }, flightSvg);
    el('path', { class: 'fl-trail', d: polyPath(pts) }, fg);

    var tip = cubicAt(P, 0.55), tan = cubicTan(P, 0.55);
    var ang = Math.atan2(tan.y, tan.x) * 180 / Math.PI;
    el('path', { class: 'plane', d: 'M11 0 L-6 5 L-3 0.8 L-9 1.4 L-11 -0.4 L-3 -0.9 L-6 -5 Z',
                 transform: 'translate(' + r1(tip.x) + ' ' + r1(tip.y) + ') rotate(' + r1(ang) + ')' }, fg);

    FRONT.push({ mr: mr, dy: Math.min(dy, ay), ext: run + 30, rise: f.rise });
  });

  MASK = { solid: mSolid, fade: mFade };
  lastFront = -1;
  paint();
  requestAnimationFrame(function () { building = false; });
}

/* ---- scroll: one write per frame, no easing, never fights the wheel ---- */
var MASK = null, lastFront = -1, queued = false;

function paint() {
  queued = false;
  if (!MASK) return;
  var eye = window.scrollY + window.innerHeight * 0.62;
  var front = clamp(eye - pageTop, 0, pageH);
  if (Math.abs(front - lastFront) < 0.5) return;
  lastFront = front;

  MASK.solid.setAttribute('height', r1(front));
  MASK.fade.setAttribute('y', r1(front));

  FRONT.forEach(function (s) {
    var p = clamp((front - s.dy) / (s.rise * 1.5), 0, 1);
    s.mr.setAttribute('width', r1(p * (s.ext + 40)));
  });

  var yr = yToYear(front);
  odo.textContent = 'KM ' + Math.round((yr - KM_ZERO) * KM_PER_YEAR).toLocaleString('en-GB');
}
function onScroll() { if (!queued) { queued = true; requestAnimationFrame(paint); } }

function fullyDrawn() {
  if (!MASK) return;
  MASK.solid.setAttribute('height', pageH);
  MASK.fade.setAttribute('y', pageH);
  FRONT.forEach(function (s) { s.mr.setAttribute('width', s.ext + 40); });
  odo.textContent = 'KM 2,000';
}

function attachScroll() {
  window.removeEventListener('scroll', onScroll);
  if (reduceMQ.matches) { fullyDrawn(); return; }
  window.addEventListener('scroll', onScroll, { passive: true });
  lastFront = -1; paint();
}

/* ---- entries ink in once, and never un-ink ---- */
var seen = new WeakSet();
var io = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) {
    if (!e.isIntersecting) return;
    e.target.classList.add('is-inked');
    io.unobserve(e.target);
    var sec = e.target.closest('[data-ctl]');
    if (sec && e.target.classList.contains('slip') && !seen.has(sec)) {
      seen.add(sec);
      var c = CONTROLS.filter(function (x) { return x.kind === 'control'; })[+sec.dataset.idx];
      if (c) addToKit(c);
    }
  });
}, { rootMargin: '0px 0px -32% 0px', threshold: 0.02 });

/* Anything at or above the fold is inked immediately, with no animation.
   IntersectionObserver only fires on elements that actually intersect, so a
   reload at a scrolled position - or a jump to an anchor - would otherwise
   leave everything above the viewport permanently invisible. That is a real
   hazard mid-presentation, not a theoretical one. */
function observeAll() {
  document.querySelectorAll('.inks:not(.is-inked)').forEach(function (n) {
    if (n.getBoundingClientRect().top < window.innerHeight) {
      n.classList.add('is-inked');
      var sec = n.closest('[data-ctl]');
      if (sec && n.classList.contains('slip') && !seen.has(sec)) {
        seen.add(sec);
        var c = CONTROLS.filter(function (x) { return x.kind === 'control'; })[+sec.dataset.idx];
        if (c) addToKit(c);
      }
    } else {
      io.observe(n);
    }
  });
}

/* ---- rebuild triggers ---- */
var bt = 0;
function schedule() { clearTimeout(bt); bt = setTimeout(function () { build(); observeAll(); }, 70); }

var ro = new ResizeObserver(function () { if (!building) schedule(); });
strip.querySelectorAll('[data-y0]').forEach(function (n) { ro.observe(n); });
ro.observe(page);
window.addEventListener('resize', schedule);
reduceMQ.addEventListener('change', attachScroll);

/* ---- theme ---- */
var lamp = document.getElementById('lamp');
try {
  var saved = localStorage.getItem('brevet-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
} catch (e) {}
lamp.addEventListener('click', function () {
  var cur = document.documentElement.getAttribute('data-theme');
  if (!cur) {
    cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('brevet-theme', next); } catch (e) {}
});

/* ---- go ---- */
function start() { build(); observeAll(); attachScroll(); }
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(start);
  setTimeout(function () { if (!MASK) start(); }, 1800);
} else {
  window.addEventListener('load', start);
}
})();
</script>
